      - roadmap-collaboration
      - dashboard
      - companion
      - achievements
      - events
      - profile
    fields:
      - name: createSafeStorage
        type: "function(storage) -> storage adapter"
      - name: localStore
        type: "storage adapter for localStorage"
      - name: sessionStore
        type: "storage adapter for sessionStorage"
      - name: readJSON
        type: "method(key, fallback) -> parsed value"
      - name: writeJSON
        type: "method(key, value) -> void"
      - name: writeJSONStrict
        type: "method(key, value) -> void or Error"
      - name: removeItem
        type: "method(key) -> void"
      - name: dispatchEvent
        type: "browser custom/storage event notification"
    god_class: false
    split_candidate: false
    migration_strategy: wrap
    notes: "Shared browser persistence boundary; ordinary writes can fall back to memory while strict writes require durable browser storage."

